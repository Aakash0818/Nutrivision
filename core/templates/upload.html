<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Food Image | NutriVision</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(
                rgba(0,0,0,0.7),
                rgba(0,0,0,0.7)
            ),
            url("https://images.unsplash.com/photo-1490645935967-10de6ba17061");
            background-size: cover;
            background-position: center;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .upload-card {
            max-width: 520px;
            margin: auto;
            margin-top: 120px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.35);
            text-align: center;
        }

        .upload-card h3 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .upload-box {
            border: 2px dashed #2c7be5;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background-color: #f8f9fa;
        }

        .upload-box input {
            display: none;
        }

        .btn-upload {
            background: #28a745;
            color: white;
            font-size: 1.1rem;
            padding: 10px;
        }

        .preview-img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-dark bg-dark fixed-top shadow">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}">NutriVision</a>

        <div class="d-flex">
            <span class="navbar-text text-white me-3">
                Welcome, {{ request.user.username }}
            </span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<!-- 🟣 UPLOAD CARD -->
<div class="upload-card">
    <h3>Upload Food Image</h3>
    <p class="text-muted">
        Upload a food image to analyze calories, nutrition,
        and health suitability using AI.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label class="upload-box">
            <strong>Click to select image</strong><br>
            <span class="text-muted">JPG, PNG supported</span>
            <input type="file" name="food_image" accept="image/*" required onchange="previewImage(event)">
        </label>

        <img id="preview" class="preview-img"/>

        <button type="submit" class="btn btn-upload w-100 mt-3">
            Analyze Food
        </button>
    </form>
</div>

<!-- Image Preview Script -->
<script>
function previewImage(event) {
    const img = document.getElementById('preview');
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = 'block';
}
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
